name: Save Webpage to Single HTML

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'כתובת ה-URL לשמירה'
        required: true
        type: string

jobs:
  save-page:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install SingleFile and Playwright Chromium
        run: |
          npm install -g single-file-cli
          npx playwright install chromium --with-deps

      - name: Download page and embed assets
        run: |
          single-file "${{ github.event.inputs.url }}" output.html

      - name: Upload HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-webpage
          path: output.html
